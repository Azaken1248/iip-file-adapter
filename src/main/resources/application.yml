spring:
  application:
    name: file-adapter
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: file-adapter
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # DLQ envelopes are built and JSON-serialized by hand (DlqPublisher),
      # not via a JSON-aware Kafka serializer.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

iip:
  topics:
    intern-created: intern.created
    intern-dlq: intern.dlq
  file:
    output-path: ${FILE_OUTPUT_PATH:./data/interns.csv}
    dedup-store-path: ${DEDUP_STORE_PATH:./data/file-adapter-dedup}
  retry:
    max-attempts: ${RETRY_MAX_ATTEMPTS:3}
    initial-backoff-ms: ${RETRY_INITIAL_BACKOFF_MS:200}
    multiplier: ${RETRY_MULTIPLIER:2.0}
