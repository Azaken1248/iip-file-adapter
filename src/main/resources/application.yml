spring:
  application:
    name: file-adapter
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: file-adapter
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # DLQ envelopes are built and JSON-serialized by hand (DlqPublisher),
      # not via a JSON-aware Kafka serializer.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

iip:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  envelope-schema:
    # Phase 4.8. `registry` fetches the platform's envelope schema from the
    # Schema Registry at startup; `classpath` reads a fixture, which is how
    # tests run. The default is `classpath` and the packaged jar carries no
    # schema file, so a deployment that forgets to set this fails at startup
    # naming what is missing rather than consuming unvalidated messages.
    source: ${ENVELOPE_SCHEMA_SOURCE:classpath}
    registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
    # One subject for the whole platform: the envelope is identical for every
    # contract, so per-topic subjects would be N copies of one artifact.
    subject: ${ENVELOPE_SCHEMA_SUBJECT:iip.envelope-value}
  topics:
    # Phase 3.6: topics are derived from the contract id
    # ({contractId}.created). The DLQ is platform-wide, not per
    # contract -- it is an operator surface, filterable by the
    # contractId every DLQ envelope carries.
    intern-created: ${TOPIC_INTERNS_CREATED:interns.created}
    intern-dlq: ${TOPIC_DLQ:iip.dlq}
  catalog:
    # Phase 6.1. Where to announce that a `csv` adapter type exists. Only the
    # address is configured -- what is announced ships in the jar, next to the
    # code that implements it, so the two cannot drift.
    #
    # Unlike the db-adapter's registry URL, this one is not required for the
    # adapter to work: this service reads its topic and its output path from
    # its own configuration, so an unreachable registry costs it a line in a
    # dropdown and nothing else.
    registry-url: ${CONTRACT_REGISTRY_URL:http://localhost:8083}
    # Five minutes, not the 30s the attachment refresh uses. Re-announcing
    # exists so the catalog heals after the registry is restarted or restored
    # from a backup, which is a minutes-scale concern -- and every pass is an
    # upsert, so a shorter interval would write to the registry's database
    # forever to keep a row that has not changed.
    refresh-interval-ms: ${CATALOG_REFRESH_INTERVAL_MS:300000}
  file:
    output-path: ${FILE_OUTPUT_PATH:./data/interns.csv}
    dedup-store-path: ${DEDUP_STORE_PATH:./data/file-adapter-dedup}
  retry:
    max-attempts: ${RETRY_MAX_ATTEMPTS:3}
    initial-backoff-ms: ${RETRY_INITIAL_BACKOFF_MS:200}
    multiplier: ${RETRY_MULTIPLIER:2.0}
